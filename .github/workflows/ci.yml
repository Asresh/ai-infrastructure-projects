name: project checks

on:
  push:
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    defaults:
      run:
        working-directory: project01-inference-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Local failure and recovery demo
        run: python -m scripts.demo --output /tmp/gateway-demo-results.json
